<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Transliterator</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 16px; margin: 0; }
    select, button { padding: 14px; font-size: 18px; border: none; border-radius: 10px; }
    select { width: 100%; background: #242424; color: #fff; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    #btn { flex: 1; background: #1e88e5; color: #fff; font-weight: bold; }
    #clearBtn { background: #333; color: #fff; }
    #status { color: #a5d6a7; margin-top: 12px; font-size: 15px; }
    #output { margin-top: 12px; font-size: 26px; background: #1e1e1e; padding: 15px; border-radius: 10px; height: 60vh; overflow-y: auto; line-height: 1.4; }
    #interim { color: #90caf9; }
  </style>
  <script>
    window.onerror = function(msg, url, line) {
      var s = document.getElementById("status");
      if (s) s.textContent = "JS ERROR line " + line + ": " + msg;
    };
  </script>
</head>
<body>
  <select id="lang" onchange="restartIfActive()">
    <option value="ne-NP">Nepali (Romanized)</option>
    <option value="hi-IN">Hindi (Romanized)</option>
    <option value="en-IN">English</option>
  </select>

  <div class="row">
    <button id="clearBtn" onclick="clearBox()">Clear</button>
    <button id="btn" onclick="toggleListen()">Start Listening</button>
  </div>

  <div id="status">Status: Ready</div>
  <div id="output"><span id="final"></span><span id="interim"></span></div>

  <script>
    var rec = null;
    var listening = false;

    var vMap = {'अ':'a','आ':'aa','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au'};
    var mMap = {'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au'};
    var cMap = {'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'w','श':'sh','ष':'sh','स':'s','ह':'h'};
    var fix = {'तपाईं':'tapai','तपाई':'tapai','हुन्छ':'hunchha','छैन':'chhaina','कस्तो':'kasto','छ':'chha','मैं':'main','हैं':'hain','है':'hai','नहीं':'nahi','कैसे':'kaise','क्या':'kya'};

    function toRoman(text, lang) {
      if (lang === "en-IN") return text;
      return text.split(" ").map(function(w) {
        if (fix[w]) return fix[w];
        var out = "", chars = Array.from(w);
        for (var i = 0; i < chars.length; i++) {
          var c = chars[i], n = chars[i + 1];
          if (vMap[c]) out += vMap[c];
          else if (mMap[c]) out += mMap[c];
          else if (c === 'ं' || c === 'ँ') out += 'n';
          else if (c === '्') {}
          else if (cMap[c]) {
            out += (c === 'व' && lang === 'hi-IN') ? 'v' : cMap[c];
            if (n !== '्' && !mMap[n] && (i < chars.length - 1 || chars.length === 1)) out += 'a';
          } else out += c;
        }
        return out;
      }).join(" ");
    }

    function startMic() {
      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        document.getElementById("status").textContent = "ERROR: Open in Google Chrome.";
        return;
      }
      if (rec) { try { rec.abort(); } catch (e) {} }

      var lang = document.getElementById("lang").value;
      rec = new SpeechRec();
      rec.lang = lang;
      rec.continuous = false;
      rec.interimResults = true;

      rec.onstart = function() {
        document.getElementById("status").textContent = "Status: Listening (" + lang + ")...";
      };

      rec.onresult = function(e) {
        var fin = "", inter = "";
        for (var i = e.resultIndex; i < e.results.length; i++) {
          var t = toRoman(e.results[i][0].transcript, lang);
          if (e.results[i].isFinal) fin += t + " ";
          else inter += t;
        }
        if (fin) document.getElementById("final").textContent += fin;
        document.getElementById("interim").textContent = inter;
        var box = document.getElementById("output");
        box.scrollTop = box.scrollHeight;
      };

      rec.onerror = function(e) {
        if (e.error === "not-allowed") {
          document.getElementById("status").textContent = "ERROR: Mic permission denied";
          stopMic();
        }
      };

      rec.onend = function() {
        var interEl = document.getElementById("interim");
        if (interEl.textContent.trim()) {
          document.getElementById("final").textContent += interEl.textContent.trim() + " ";
          interEl.textContent = "";
        }
        if (listening) {
          setTimeout(function() { if (listening) startMic(); }, 150);
        }
      };

      try { rec.start(); } catch (err) {}
    }

    function toggleListen() {
      var btn = document.getElementById("btn");
      if (listening) {
        stopMic();
      } else {
        listening = true;
        btn.textContent = "Stop Listening";
        btn.style.background = "#e53935";
        startMic();
      }
    }

    function stopMic() {
      listening = false;
      var btn = document.getElementById("btn");
      btn.textContent = "Start Listening";
      btn.style.background = "#1e88e5";
      document.getElementById("status").textContent = "Status: Stopped";
      if (rec) { try { rec.stop(); } catch (e) {} }
    }

    function restartIfActive() { if (listening) startMic(); }
    function clearBox() {
      document.getElementById("final").textContent = "";
      document.getElementById("interim").textContent = "";
    }
  </script>
</body>
</html>
