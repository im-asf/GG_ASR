<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Test</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
    button { width: 100%; padding: 18px; font-size: 20px; margin-top: 15px; border: none; border-radius: 10px; background: #1e88e5; color: #fff; }
    #status { color: #a5d6a7; margin-top: 15px; font-size: 16px; }
    #output { margin-top: 20px; font-size: 26px; background: #1e1e1e; padding: 15px; border-radius: 10px; min-height: 150px; }
  </style>
</head>
<body>
  <select id="lang" style="width:100%; padding:14px; font-size:18px;">
    <option value="ne-NP">Nepali (ne-NP)</option>
    <option value="hi-IN">Hindi (hi-IN)</option>
    <option value="en-IN">English (en-IN)</option>
  </select>

  <button id="btn" onclick="startTest()">Start Listening</button>
  <div id="status">Status: Waiting for tap...</div>
  <div id="output">Spoken text will appear here...</div>

  <script>
    function startTest() {
      const status = document.getElementById("status");
      const output = document.getElementById("output");
      const btn = document.getElementById("btn");
      const lang = document.getElementById("lang").value;

      btn.style.background = "#e53935";
      status.textContent = "Status: Button worked! Starting mic...";

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        status.textContent = "ERROR: This browser does not support Web Speech.";
        return;
      }

      const rec = new SpeechRec();
      rec.lang = lang;
      rec.continuous = false;
      rec.interimResults = true;

      rec.onstart = () => status.textContent = "Status: Listening (" + lang + ")...";
      rec.onerror = (e) => status.textContent = "ERROR: " + e.error;
      rec.onend = () => {
        btn.style.background = "#1e88e5";
        status.textContent += " (Stopped)";
      };
      rec.onresult = (e) => {
        let text = "";
        for (let i = 0; i < e.results.length; i++) {
          text += e.results[i][0].transcript + " ";
        }
        output.textContent = text;
      };

      try {
        rec.start();
      } catch (err) {
        status.textContent = "START ERROR: " + err.message;
      }
    }
  </script>
</body>
</html>
